<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXMAN CARE - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blink-animation {
            0% { background-color: rgba(59, 130, 246, 0.2); }
            50% { background-color: rgba(59, 130, 246, 0.6); }
            100% { background-color: rgba(59, 130, 246, 0.2); }
        }
        .blinking-row {
            animation: blink-animation 1s infinite;
        }
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-100 flex items-center justify-center p-4">

    <!-- Login Container -->
    <div id="login-container" class="bg-slate-900/90 backdrop-blur-2xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-800">
        <div class="text-center mb-6">
            <span class="bg-blue-600/10 text-blue-400 text-xs font-semibold px-3.5 py-1.5 rounded-full border border-blue-500/20 uppercase tracking-widest">Secure Portal</span>
            <h1 class="text-3xl font-extrabold text-white mt-3 tracking-tight">MAXMAN CARE</h1>
            <p class="text-sm text-slate-400 mt-1">Apne account mein login karein</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="login-username" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Jaise: Owner, Manager">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Password daalein">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition shadow-lg text-sm">
                Sign In
            </button>
        </form>

        <div id="error-msg" class="mt-4 text-center text-xs text-red-400 font-medium hidden"></div>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard-container" class="min-h-screen flex flex-col hidden w-full">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <h2 class="text-lg font-bold text-white tracking-wide">MAXMAN CARE CRM</h2>
                <span id="user-role-badge" class="px-2.5 py-1 bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs font-semibold rounded-full uppercase">Role</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-welcome" class="text-sm font-medium text-slate-300">Welcome</span>
                <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-lg text-xs font-semibold transition">Logout</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Total Leads</p>
                    <h3 id="total-leads-count" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Assigned Leads</p>
                    <h3 class="text-2xl font-bold text-blue-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Converted</p>
                    <h3 class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">RTO / Pending</p>
                    <h3 class="text-2xl font-bold text-amber-400 mt-1">0</h3>
                </div>
            </div>

            <!-- User Management Section (Visible to Owner/Manager) -->
            <div id="user-management-section" class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 hidden">
                <h3 class="font-bold text-white text-base mb-4">👥 User & ID Management (Create / Delete)</h3>
                <form onsubmit="handleCreateUser(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 mb-6">
                    <input type="text" id="new-user" placeholder="Username" required class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white">
                    <input type="password" id="new-pass" placeholder="Password" required class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white">
                    <input type="text" id="new-name" placeholder="Full Name" required class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white">
                    <select id="new-role" class="px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white">
                        <option value="Owner">Owner</option>
                        <option value="Manager">Manager</option>
                        <option value="Team Leader">Team Leader</option>
                        <option value="Agent">Agent</option>
                        <option value="RTO">RTO</option>
                        <option value="Confirmation">Confirmation</option>
                        <option value="HR">HR</option>
                    </select>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-xl text-sm transition">Create ID</button>
                </form>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-950/40 text-slate-400 uppercase text-xs border-b border-slate-800">
                                <th class="p-3">Username</th>
                                <th class="p-3">Name</th>
                                <th class="p-3">Role</th>
                                <th class="p-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="divide-y divide-slate-800 text-slate-300">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Leads Table -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-bold text-white text-sm">Leads Management</h3>
                    <button class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-500 transition shadow">+ Add Lead</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-950/40 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                <th class="px-6 py-3 font-semibold">Name</th>
                                <th class="px-6 py-3 font-semibold">Phone</th>
                                <th class="px-6 py-3 font-semibold">Product</th>
                                <th class="px-6 py-3 font-semibold">Status</th>
                                <th class="px-6 py-3 font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body" class="divide-y divide-slate-800 text-sm text-slate-300">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let activeCallRowId = null;
        let currentUser = null;

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    currentUser = data;
                    localStorage.setItem('crm_user', JSON.stringify(data));
                    showDashboard(data);
                } else {
                    errorMsg.innerText = data.message || 'Invalid credentials';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Server connection error';
                errorMsg.classList.remove('hidden');
            }
        }

        function showDashboard(user) {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.remove('hidden');
            document.getElementById('user-welcome').innerText = `Hello, ${user.name}`;
            document.getElementById('user-role-badge').innerText = user.role;

            // Show User Management panel only for Owner or Manager
            if (user.role === 'Owner' || user.role === 'Manager') {
                document.getElementById('user-management-section').classList.remove('hidden');
                loadUsersList();
            }
            loadLeads();
        }

        async function loadUsersList() {
            try {
                const res = await fetch('/api/users');
                const users = await res.json();
                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = '';
                users.forEach(u => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/40">
                            <td class="p-3 font-medium text-white">${u.username}</td>
                            <td class="p-3">${u.name}</td>
                            <td class="p-3"><span class="px-2 py-0.5 bg-blue-900/40 text-blue-400 rounded-full text-xs">${u.role}</span></td>
                            <td class="p-3">
                                <button onclick="deleteUser('${u.username}')" class="bg-red-600/80 hover:bg-red-600 text-white px-2.5 py-1 rounded-lg text-xs font-semibold transition">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Failed to load users', err);
            }
        }

        async function handleCreateUser(e) {
            e.preventDefault();
            const username = document.getElementById('new-user').value;
            const password = document.getElementById('new-pass').value;
            const name = document.getElementById('new-name').value;
            const role = document.getElementById('new-role').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, name, role })
            });
            const data = await res.json();
            alert(data.message);
            if (data.success) {
                document.getElementById('new-user').value = '';
                document.getElementById('new-pass').value = '';
                document.getElementById('new-name').value = '';
                loadUsersList();
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Kya aap ${username} ko delete karna chahte hain?`)) return;
            const res = await fetch(`/api/users/${username}`, { method: 'DELETE' });
            const data = await res.json();
            alert(data.message);
            loadUsersList();
        }

        async function loadLeads() {
            try {
                const response = await fetch('/api/leads');
                const leads = await response.json();
                document.getElementById('total-leads-count').innerText = leads.length;
                
                const tbody = document.getElementById('leads-table-body');
                tbody.innerHTML = '';
                leads.forEach((lead, index) => {
                    const rowId = `lead-row-${index}`;
                    const isBlinking = activeCallRowId === rowId ? 'blinking-row' : '';
                    tbody.innerHTML += `
                        <tr id="${rowId}" class="hover:bg-slate-800/40 transition ${isBlinking}">
                            <td class="px-6 py-4 font-medium text-white">${lead.name}</td>
                            <td class="px-6 py-4">${lead.phone}</td>
                            <td class="px-6 py-4">${lead.product || 'N/A'}</td>
                            <td class="px-6 py-4"><span class="px-2.5 py-1 bg-amber-950/60 text-amber-400 border border-amber-800/50 text-xs font-semibold rounded-full">${lead.leadStatus || lead.status || 'New'}</span></td>
                            <td class="px-6 py-4">
                                <button onclick="startCall('${rowId}', '${lead.phone}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">
                                    📞 Call
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Failed to load leads', err);
            }
        }

        function startCall(rowId, phone) {
            if (activeCallRowId) {
                const prevRow = document.getElementById(activeCallRowId);
                if (prevRow) prevRow.classList.remove('blinking-row');
            }
            activeCallRowId = rowId;
            const currentRow = document.getElementById(rowId);
            if (currentRow) {
                currentRow.classList.add('blinking-row');
            }
            alert(`Calling ${phone} ... (Data is blinking on screen)`);
        }

        function handleLogout() {
            localStorage.removeItem('crm_user');
            location.reload();
        }

        window.onload = () => {
            const savedUser = localStorage.getItem('crm_user');
            if (savedUser) {
                showDashboard(JSON.parse(savedUser));
            }
        };
    </script>
</body>
</html>
