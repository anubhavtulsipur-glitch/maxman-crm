<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXMAN CARE - Multi-Tier CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blink-animation {
            0% { background-color: rgba(59, 130, 246, 0.2); }
            50% { background-color: rgba(59, 130, 246, 0.6); }
            100% { background-color: rgba(59, 130, 246, 0.2); }
        }
        .blinking-row {
            animation: blink-animation 1s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen font-sans text-slate-100">

    <!-- Login Container -->
    <div id="login-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-slate-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300">MAXMAN CARE</h1>
                <p class="text-sm text-slate-400 mt-1">Select your role to login</p>
            </div>

            <!-- Role Selection Buttons -->
            <div class="grid grid-cols-2 gap-3 mb-6" id="role-buttons">
                <button type="button" onclick="selectRole('Owner', 'Owner')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group">
                    <p class="text-xs font-bold text-blue-400 uppercase">Owner</p>
                    <p class="text-sm font-semibold text-slate-200">Owner</p>
                </button>
                <button type="button" onclick="selectRole('Manager', 'Manager')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group">
                    <p class="text-xs font-bold text-blue-400 uppercase">Manager</p>
                    <p class="text-sm font-semibold text-slate-200">Sales Manager</p>
                </button>
                <button type="button" onclick="selectRole('TL', 'Team Leader')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group">
                    <p class="text-xs font-bold text-blue-400 uppercase">TL</p>
                    <p class="text-sm font-semibold text-slate-200">Team Lead</p>
                </button>
                <button type="button" onclick="selectRole('Agent', 'Agent')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group">
                    <p class="text-xs font-bold text-blue-400 uppercase">Agent</p>
                    <p class="text-sm font-semibold text-slate-200">Calling Agent</p>
                </button>
                <button type="button" onclick="selectRole('RTO', 'RTO')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group">
                    <p class="text-xs font-bold text-blue-400 uppercase">RTO</p>
                    <p class="text-sm font-semibold text-slate-200">RTO Executive</p>
                </button>
                <button type="button" onclick="selectRole('Confirmation', 'Confirmation')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group">
                    <p class="text-xs font-bold text-blue-400 uppercase">Confirmation</p>
                    <p class="text-sm font-semibold text-slate-200">Confirmation Team</p>
                </button>
                <button type="button" onclick="selectRole('HR', 'HR')" class="p-3 bg-slate-700/50 border border-slate-600 rounded-xl text-left hover:border-blue-400 hover:bg-slate-700 transition group col-span-2">
                    <p class="text-xs font-bold text-blue-400 uppercase">HR</p>
                    <p class="text-sm font-semibold text-slate-200">HR Manager</p>
                </button>
            </div>
            
            <!-- Actual Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 hidden">
                <div class="flex items-center justify-between bg-slate-700/60 p-3 rounded-lg border border-slate-600">
                    <span id="selected-role-text" class="text-sm font-bold text-blue-300">Selected Role: None</span>
                    <button type="button" onclick="resetRoleSelection()" class="text-xs text-blue-400 hover:underline font-semibold">Change Role</button>
                </div>
                <input type="hidden" id="username">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Enter password (e.g. 12345)">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-lg transition duration-200 shadow-lg shadow-blue-600/30 text-sm">
                    Sign In
                </button>
            </form>

            <div class="mt-4 text-center">
                <button type="button" onclick="toggleForgotPassword()" class="text-xs text-blue-400 hover:underline font-medium">Forgot Password?</button>
            </div>

            <div id="error-msg" class="mt-4 text-center text-xs text-red-400 font-medium hidden"></div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard-container" class="min-h-screen flex flex-col hidden">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <h2 class="text-lg font-bold text-white tracking-wide">MAXMAN CARE CRM</h2>
                <span id="user-role-badge" class="px-2.5 py-1 bg-blue-900/60 text-blue-300 border border-blue-700/50 text-xs font-semibold rounded-full uppercase">Role</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-welcome" class="text-sm font-medium text-slate-300">Welcome</span>
                <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-lg text-xs font-semibold transition">Logout</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Total Leads</p>
                    <h3 id="total-leads-count" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Assigned Leads</p>
                    <h3 class="text-2xl font-bold text-blue-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Converted</p>
                    <h3 class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">RTO / Pending</p>
                    <h3 class="text-2xl font-bold text-amber-400 mt-1">0</h3>
                </div>
            </div>

            <div class="bg-slate-800/80 border border-slate-700 rounded-xl shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-white text-sm">Leads Management</h3>
                    <button class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-500 transition shadow">+ Add Lead</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                                <th class="px-6 py-3 font-semibold">Name</th>
                                <th class="px-6 py-3 font-semibold">Phone</th>
                                <th class="px-6 py-3 font-semibold">Product</th>
                                <th class="px-6 py-3 font-semibold">Status</th>
                                <th class="px-6 py-3 font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body" class="divide-y divide-slate-700/60 text-sm text-slate-300">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let activeCallRowId = null;

        function selectRole(username, roleName) {
            document.getElementById('username').value = username;
            document.getElementById('selected-role-text').innerText = `Role: ${roleName} (${username})`;
            document.getElementById('role-buttons').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
        }

        function resetRoleSelection() {
            document.getElementById('role-buttons').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('error-msg').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('crm_user', JSON.stringify(data));
                    showDashboard(data);
                } else {
                    errorMsg.innerText = data.message || 'Invalid credentials';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Server connection error';
                errorMsg.classList.remove('hidden');
            }
        }

        function toggleForgotPassword() {
            const username = prompt("Enter your exact username (e.g. Manager, Owner):");
            if (!username) return;
            const newPassword = prompt("Enter your new password:");
            if (!newPassword) return;

            fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, newPassword })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
            })
            .catch(err => {
                alert('Something went wrong!');
            });
        }

            document.getElementById('dashboard-container').classList.remove('
