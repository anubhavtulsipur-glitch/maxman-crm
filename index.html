<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXMAN CARE - Multi-Tier CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes blink-animation {
            0% { background-color: rgba(59, 130, 246, 0.2); }
            50% { background-color: rgba(59, 130, 246, 0.6); }
            100% { background-color: rgba(59, 130, 246, 0.2); }
        }
        .blinking-row {
            animation: blink-animation 1s infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 min-h-screen font-sans text-slate-100 flex items-center justify-center p-4">

    <!-- Login Container -->
    <div id="login-container" class="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-xl border border-slate-800">
        <div class="text-center mb-8">
            <span class="bg-blue-500/10 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full border border-blue-500/20 uppercase tracking-widest">Secure Portal</span>
            <h1 class="text-3xl font-extrabold text-white mt-3 tracking-tight">MAXMAN CARE</h1>
            <p class="text-sm text-slate-400 mt-1">Apna role select karke login karein</p>
        </div>

        <!-- Role Selection Cards -->
        <div class="grid grid-cols-2 gap-3.5 mb-6" id="role-buttons">
            <button type="button" onclick="selectRole('Owner', 'Owner')" class="p-4 bg-slate-800/80 hover:bg-blue-600/20 border border-slate-700/80 hover:border-blue-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center font-bold text-lg group-hover:bg-blue-500 group-hover:text-white transition">👑</div>
                <div>
                    <p class="text-xs font-bold text-blue-400 uppercase tracking-wider">Owner</p>
                    <p class="text-sm font-semibold text-white">Full Access</p>
                </div>
            </button>

            <button type="button" onclick="selectRole('Manager', 'Manager')" class="p-4 bg-slate-800/80 hover:bg-indigo-600/20 border border-slate-700/80 hover:border-indigo-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-500 group-hover:text-white transition">📊</div>
                <div>
                    <p class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Manager</p>
                    <p class="text-sm font-semibold text-white">Sales Manager</p>
                </div>
            </button>

            <button type="button" onclick="selectRole('TL', 'Team Leader')" class="p-4 bg-slate-800/80 hover:bg-purple-600/20 border border-slate-700/80 hover:border-purple-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center font-bold text-lg group-hover:bg-purple-500 group-hover:text-white transition">👥</div>
                <div>
                    <p class="text-xs font-bold text-purple-400 uppercase tracking-wider">TL</p>
                    <p class="text-sm font-semibold text-white">Team Lead</p>
                </div>
            </button>

            <button type="button" onclick="selectRole('Agent', 'Agent')" class="p-4 bg-slate-800/80 hover:bg-emerald-600/20 border border-slate-700/80 hover:border-emerald-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold text-lg group-hover:bg-emerald-500 group-hover:text-white transition">📞</div>
                <div>
                    <p class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Agent</p>
                    <p class="text-sm font-semibold text-white">Calling Agent</p>
                </div>
            </button>

            <button type="button" onclick="selectRole('RTO', 'RTO')" class="p-4 bg-slate-800/80 hover:bg-amber-600/20 border border-slate-700/80 hover:border-amber-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold text-lg group-hover:bg-amber-500 group-hover:text-white transition">🔄</div>
                <div>
                    <p class="text-xs font-bold text-amber-400 uppercase tracking-wider">RTO</p>
                    <p class="text-sm font-semibold text-white">RTO Executive</p>
                </div>
            </button>

            <button type="button" onclick="selectRole('Confirmation', 'Confirmation')" class="p-4 bg-slate-800/80 hover:bg-cyan-600/20 border border-slate-700/80 hover:border-cyan-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm">
                <div class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center font-bold text-lg group-hover:bg-cyan-500 group-hover:text-white transition">✅</div>
                <div>
                    <p class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Confirmation</p>
                    <p class="text-sm font-semibold text-white">Confirm Team</p>
                </div>
            </button>

            <button type="button" onclick="selectRole('HR', 'HR')" class="p-4 bg-slate-800/80 hover:bg-pink-600/20 border border-slate-700/80 hover:border-pink-500 rounded-2xl text-left transition-all duration-200 group flex items-center space-x-3 shadow-sm col-span-2">
                <div class="w-10 h-10 rounded-xl bg-pink-500/10 text-pink-400 flex items-center justify-center font-bold text-lg group-hover:bg-pink-500 group-hover:text-white transition">🏢</div>
                <div>
                    <p class="text-xs font-bold text-pink-400 uppercase tracking-wider">HR</p>
                    <p class="text-sm font-semibold text-white">HR Manager</p>
                </div>
            </button>
        </div>
        
        <!-- Actual Login Form (Hidden initially) -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 hidden">
            <div class="flex items-center justify-between bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <div>
                    <span class="text-xs text-slate-400 block">Selected Role</span>
                    <span id="selected-role-text" class="text-sm font-bold text-blue-400">None</span>
                </div>
                <button type="button" onclick="resetRoleSelection()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg font-medium transition">Change Role</button>
            </div>
            <input type="hidden" id="username">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password Daalein</label>
                <input type="password" id="password" required class="w-full px-4 py-3.5 rounded-xl bg-slate-950 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Enter password (12345)">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3.5 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 text-sm">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center">
            <button type="button" onclick="toggleForgotPassword()" class="text-xs text-slate-400 hover:text-blue-400 transition font-medium">Forgot Password?</button>
        </div>

        <div id="error-msg" class="mt-4 text-center text-xs text-red-400 font-medium hidden"></div>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard-container" class="min-h-screen flex flex-col hidden w-full">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <h2 class="text-lg font-bold text-white tracking-wide">MAXMAN CARE CRM</h2>
                <span id="user-role-badge" class="px-2.5 py-1 bg-blue-900/60 text-blue-300 border border-blue-700/50 text-xs font-semibold rounded-full uppercase">Role</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-welcome" class="text-sm font-medium text-slate-300">Welcome</span>
                <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-lg text-xs font-semibold transition">Logout</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
                <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Total Leads</p>
                    <h3 id="total-leads-count" class="text-2xl font-bold text-white mt-1">0</h3>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Assigned Leads</p>
                    <h3 class="text-2xl font-bold text-blue-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Converted</p>
                    <h3 class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-sm">
                    <p class="text-xs font-semibold text-slate-400 uppercase">RTO / Pending</p>
                    <h3 class="text-2xl font-bold text-amber-400 mt-1">0</h3>
                </div>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-bold text-white text-sm">Leads Management</h3>
                    <button class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-blue-500 transition shadow">+ Add Lead</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                <th class="px-6 py-3 font-semibold">Name</th>
                                <th class="px-6 py-3 font-semibold">Phone</th>
                                <th class="px-6 py-3 font-semibold">Product</th>
                                <th class="px-6 py-3 font-semibold">Status</th>
                                <th class="px-6 py-3 font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body" class="divide-y divide-slate-800 text-sm text-slate-300">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let activeCallRowId = null;

        function selectRole(username, roleName) {
            document.getElementById('username').value = username;
            document.getElementById('selected-role-text').innerText = `${roleName} (${username})`;
            document.getElementById('role-buttons').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('error-msg').classList.add('hidden');
        }

        function resetRoleSelection() {
            document.getElementById('role-buttons').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('error-msg').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('crm_user', JSON.stringify(data));
                    showDashboard(data);
                } else {
                    errorMsg.innerText = data.message || 'Invalid credentials';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'Server connection error';
                errorMsg.classList.remove('hidden');
            }
        }

        function toggleForgotPassword() {
            const username = prompt("Enter your username (e.g. Manager, Owner):");
            if (!username) return;
            const newPassword = prompt("Enter your new password:");
            if (!newPassword) return;

            fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, newPassword })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
            })
            .catch(err => {
                alert('Something went wrong!');
            });
        }

        function showDashboard(user) {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('dashboard-container').classList.remove('hidden');
            document.getElementById('user-welcome').innerText = `Hello, ${user.name}`;
            document.getElementById('user-role-badge').innerText = user.role;
            loadLeads();
        }

        async function loadLeads() {
            try {
                const response = await fetch('/api/leads');
                const leads = await response.json();
                document.getElementById('total-leads-count').innerText = leads.length;
                
                const tbody = document.getElementById('leads-table-body');
                tbody.innerHTML = '';
                leads.forEach((lead, index) => {
                    const rowId = `lead-row-${index}`;
                    const isBlinking = activeCallRowId === rowId ? 'blinking-row' : '';
                    tbody.innerHTML += `
                        <tr id="${rowId}" class="hover:bg-slate-800/40 transition ${isBlinking}">
                            <td class="px-6 py-4 font-medium text-white">${lead.name}</td>
                            <td class="px-6 py-4">${lead.phone}</td>
                            <td class="px-6 py-4">${lead.product || 'N/A'}</td>
                            <td class="px-6 py-4"><span class="px-2.5 py-1 bg-amber-950/60 text-amber-400 border border-amber-800/50 text-xs font-semibold rounded-full">${lead.leadStatus || lead.status || 'New'}</span></td>
                            <td class="px-6 py-4">
                                <button onclick="startCall('${rowId}', '${lead.phone}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">
                                    📞 Call
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Failed to load leads', err);
            }
        }

        function startCall(rowId, phone) {
            if (activeCallRowId) {
                const prevRow = document.getElementById(activeCallRowId);
                if (prevRow) prevRow.classList.remove('blinking-row');
            }
            activeCallRowId = rowId;
            const currentRow = document.getElementById(rowId);
            if (currentRow) {
                currentRow.classList.add('blinking-row');
            }
            alert(`Calling ${phone} ... (Data is blinking on screen)`);
        }

        function handleLogout() {
            localStorage.removeItem('crm_user');
            location.reload();
        }

        window.onload = () => {
            const savedUser = localStorage.getItem('crm_user');
            if (savedUser) {
                showDashboard(JSON.parse(savedUser));
            }
        };
    </script>
</body>
</html>
